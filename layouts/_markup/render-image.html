{{- $image := partial "helper/image" (dict "Resources" .Page.Resources "Image" .Destination "Context" .Page) -}}

{{- /* michael.gr: read the dimensions of SVG images from the <svg> element.
Hugo cannot read the dimensions of an SVG image, so the theme leaves them out and does not make SVG images gallery images;
as a result, SVG images do not stretch to the edges of the card the way raster images do, and do not open in the lightbox.
The `width` and `height` attributes are used when they are plain numbers or pixels; otherwise, the `viewBox` is used. */ -}}
{{- if and (not $image.Width) $image.Resource (eq $image.Resource.MediaType.SubType "svg") -}}
    {{- with index (findRE `<svg[^>]*>` $image.Resource.Content 1) 0 -}}
        {{- $width := findRESubmatch `\swidth="([0-9.]+)(px)?"` . 1 -}}
        {{- $height := findRESubmatch `\sheight="([0-9.]+)(px)?"` . 1 -}}
        {{- $viewBox := findRESubmatch `\sviewBox="\s*[-0-9.]+[\s,]+[-0-9.]+[\s,]+([0-9.]+)[\s,]+([0-9.]+)\s*"` . 1 -}}
        {{- $w := 0 -}}
        {{- $h := 0 -}}
        {{- if and $width $height -}}
            {{- $w = index $width 0 1 -}}
            {{- $h = index $height 0 1 -}}
        {{- else if $viewBox -}}
            {{- $w = index $viewBox 0 1 -}}
            {{- $h = index $viewBox 0 2 -}}
        {{- end -}}
        {{- $w = int (math.Round (float $w)) -}}
        {{- $h = int (math.Round (float $h)) -}}
        {{- if and $w $h -}}
            {{- $image = merge $image (dict "Width" $w "Height" $h) -}}
        {{- end -}}
    {{- end -}}
{{- end -}}
{{- $alt := .PlainText | safeHTML -}}
{{- $title := .Title | markdownify -}}

{{/* There are some types of images that don't have width and height attributes, such as SVG */}}
{{- $galleryImage := and $image.Height $image.Width -}}

{{- $attributes := dict -}}
{{- if $galleryImage -}}
    {{- $attributes = (dict 
        "data-flex-grow" (div (mul $image.Width 100) $image.Height) 
        "data-flex-basis" (printf "%dpx" (div (mul $image.Width 240) $image.Height))
    ) -}}
{{- end -}}

{{ partial "helper/responsive-image" (dict 
    "Resource" $image.Resource
    "Widths" (cond .Page.Site.Params.ImageProcessing.Content.Enabled .Page.Site.Params.ImageProcessing.Content.Widths nil)
    "Attributes" (merge $attributes (dict 
        "src" $image.Permalink
        "width" $image.Width
        "height" $image.Height
        "alt" $alt
        "title" $title
        "data-title-escaped" ($title | htmlEscape)
        "class" (cond $galleryImage "gallery-image" "")
        "loading" "lazy"
        "sizes" "(max-width: 767px) calc(100vw - 30px), (max-width: 1023px) 700px, (max-width: 1279px) 950px, 1232px"
    ))
) }}
