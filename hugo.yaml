related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
            typographer:
                disable: true
        renderer:
            unsafe: true # Set to true if you have HTML content inside Markdown
    tableOfContents:
        startLevel: 2
        endLevel: 5
        ordered: true
    highlight:
        anchorLineNos: true
        codeFences: true
        guessSyntax: false
        lineNos: false
        lineNumbersInTable: true
        # 'tabWidth' is useless because of 'noClasses: false', according to this: https://discourse.gohugo.io/t/is-using-pygmentsuseclasses-true-affecting-the-tabwidth/31648/2
        # tabWidth: 4
        noClasses: false
