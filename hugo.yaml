# "The absolute URL of your published site including the protocol, host, path, and a trailing slash."
baseURL: https://blog.michael.gr/

# We do not set these here; instead, we pass them as arguments to Hugo.
# publishDir: --
# themesDir: --

# Hugo's working directory (`--source`) needs to be `obsidian/blog.michael.gr` because Hugo reads git
# info only from the repository of its working directory.
module:
    mounts:
        - { source: content, target: content, files: ['! **.svg'] }
        - { source: ../../temp/preprocessed-svg/content, target: content }
        - { source: ../../blog.michael.gr-hugo-theme-customizations/layouts, target: layouts }
        - { source: ../../blog.michael.gr-hugo-theme-customizations/assets, target: assets, files: ['! **.svg'] }
        - { source: ../../temp/preprocessed-svg/assets, target: assets }
        - { source: ../../blog.michael.gr-hugo-theme-customizations/static, target: static, files: ['! **.svg'] }
        - { source: ../../temp/preprocessed-svg/static, target: static }
        - { source: ../../blog.michael.gr-hugo-theme-customizations/i18n, target: i18n }

# Keep Hugo's cache out of the `obsidian` repository.
resourceDir: ../../temp/hugo-resources

# Do not produce a lock file. (Just don't run two instances of hugo simultaneously on the same repository.)
noBuildLock: true

enableGitInfo: true

locale: "en-us"
title: Michael's Blog
copyright: Michael Belivanakis (a.k.a. Mike Nakis)
theme: hugo-theme-stack
titleCaseStyle: none

# taxonomies:
#   category: categories
#   tag: tags
 
frontmatter:
    # date: the time coordinate when the post was first published.
    date:
        - time_created
        - date
        # No `:git` here: it is the date of the last commit, not the first.
        # - :contentbasename
        - :fileModTime
    # lastmod: the time coordinate when the post was last updated.
    lastmod:
        - lastmod
        - :git
        - :fileModTime
        - date
    # publishDate: the time coordinate at which the post is scheduled to be published.
    publishDate:
        - time_to_publish
        - date
    # expiryDate: the time coordinate at which the post expired or is to expire. 
    # PEARL: if you set it to 'date', hugo goes haywire with nonsensical error messages.
    expiryDate:
        - time_to_expire
        - expiryDate

# Old addresses of posts are listed in the `aliases` front matter field of each post.
# Instead of having Hugo generate an HTML redirect page for each alias, we generate a `_redirects` file, which
# Cloudflare reads and turns into proper 301 (permanent) redirects. See layouts/home.redirects.
disableAliases: true

mediaTypes:
    text/redirects: {}

outputFormats:
    redirects:
        mediaType: text/redirects
        baseName: _redirects
        isPlainText: true
        notAlternative: true

outputs:
    home:
        - html
        - rss
        - redirects

pagination:
    pagerSize: 6

permalinks:
    post: /post/:contentbasename/
    page: /:contentbasename/

services:
    googleAnalytics:
        # GA4 property "blog.michael.gr" in Google account michaelnakis@gmail.com. Loaded only after cookie consent (see params.cookies).
        id: G-H4RJK4WE5D

params:
    locale: en-us
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true

    # I do not use the favicon because I specify multiple favicons in layouts/_partials/head/custom.html
    # favicon: /favicon.svg

    # The link preview image must be in /assets/images and only its filename must be given here.
    linkPreviewImage: link-preview.png

    footer:
        since: 2001

    dateFormat:
        # PEARL: You might think that readonly <input> elements of type "date" and "time" could be used so as to have 
        #    the browser display date and time in whatever format the user prefers, but this does not work, because
        #    browsers do not bother getting the user preferences for date and time format from the operating system.
        #    So, we have no option but to pick a date and time format to display time with, and if the user does not
        #    like it, it is the user's problem.
        # PEARL: the format strings understood by Hugo are EXTREMELY weird.
        # See https://gohugo.io/functions/time/format/ and https://pkg.go.dev/time#pkg-constants
        published: "2006-01-02"
        lastUpdated: "2006-01-02"
        # michael.gr: our own addition: the full format, shown as a tooltip on the short dates above.
        full: "2006-01-02 Mon 15:04:05 MST"

    sidebar:
        avatar: /avatar-2025-400x400.jpg

    article:
        headingAnchor: false
        math: false
        toc: true
        readingTime: true
        license:
            enabled: false
            default: Licensed under CC BY-NC-SA 4.0
        list:
            showTags: true

    comments:
        enabled: true
        provider: intensedebate

    # Cookie consent banner, required by EU law for analytics cookies.
    cookies:
        enabled: true
        showSettings: true
        categories:
            analytics: true
            # IntenseDebate sets third-party cookies, so the theme loads the comments only after consent to this category.
            functional: true

    widgets:
        homepage:
            # michael.gr: no search widget; the search box is in the main menu (sidebar/left.html).
            - type: archives
              params:
                  limit: 100 # 5
#            - type: categories
#              params:
#                  limit: 10
            - type: tag-cloud
              params:
                  limit: 100 # 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username WITHOUT THE AT-SIGN
            site: "mikenakis"

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        toggle: true
        default: auto

    imageProcessing:
        cover:
            enabled: false
        content:
            enabled: false

